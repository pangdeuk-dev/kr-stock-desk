<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KR Stock Desk</title>
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <header class="top">
    <div>
      <p class="eyebrow">개인 투자 데스크</p>
      <h1>KR Stock Desk</h1>
    </div>
    <div class="indices" id="indices"></div>
  </header>

  <p class="banner">
    월 목표 +20%는 <strong>목표</strong>이지 보장이 아닙니다. 의견은 규칙 기반이며 손실이 날 수 있습니다.
    서버가 켜져 있는 평일 09:00에 시황, 11:00에 <strong>지정가·주 수·평단</strong>까지 적힌 실행 지시를 만듭니다.
    채팅 에이전트가 뉴스를 보고 쓴 파일(`briefings/날짜.json`)이 있으면 그걸 우선합니다.
  </p>

  <nav class="tabs">
    <button data-tab="board" class="on">현황</button>
    <button data-tab="opinion">오늘의 의견</button>
    <button data-tab="journal">투자일지</button>
    <button data-tab="hold">종목 등록</button>
  </nav>

  <section id="tab-board" class="tab on">
    <div class="kpis" id="kpis"></div>
    <div class="card">
      <div class="card-head">
        <h2>보유 종목</h2>
        <span class="muted" id="refresh-hint">시세 15초마다 갱신</span>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>종목</th>
              <th class="num">현재가</th>
              <th class="num">등락</th>
              <th class="num">평단</th>
              <th class="num">수량</th>
              <th class="num">평가</th>
              <th class="num">손익</th>
              <th class="num">비중</th>
            </tr>
          </thead>
          <tbody id="holdings-body"></tbody>
        </table>
      </div>
    </div>
  </section>

  <section id="tab-opinion" class="tab">
    <div class="row-actions">
      <button id="btn-morning" type="button">지금 시황 스냅샷</button>
      <button id="btn-opinion" class="primary" type="button">지금 투자의견 생성</button>
    </div>
    <div id="opinion-box"></div>
  </section>

  <section id="tab-journal" class="tab">
    <form id="journal-form" class="card">
      <h2>일지 쓰기</h2>
      <textarea id="journal-body" rows="5" placeholder="오늘 실행한 것, 지키지 못한 것, 다음날 확인할 것"></textarea>
      <button class="primary" type="submit">저장</button>
    </form>
    <div id="journal-list"></div>
  </section>

  <section id="tab-hold" class="tab">
    <form id="holding-form" class="card grid">
      <h2>보유 종목 등록</h2>
      <label>종목코드 또는 이름
        <input id="q" autocomplete="off" placeholder="005930 또는 삼성전자" />
      </label>
      <div id="search-hits" class="hits"></div>
      <label>종목코드
        <input id="ticker" required placeholder="005930" />
      </label>
      <label>종목명
        <input id="name" placeholder="자동 입력" />
      </label>
      <label>수량
        <input id="qty" type="number" min="1" step="1" required />
      </label>
      <label>평균단가 (원)
        <input id="avg" type="number" min="1" step="1" required />
      </label>
      <label class="wide">메모
        <input id="memo" placeholder="매수 이유" />
      </label>
      <button class="primary" type="submit">저장</button>
    </form>

    <form id="cash-form" class="card grid">
      <h2>현금 · 월초 자산</h2>
      <label>예수금 (원)
        <input id="cash" type="number" min="0" step="1" />
      </label>
      <label>이번 달 시작 자산 (원)
        <input id="month-start" type="number" min="0" step="1" />
      </label>
      <button class="primary" type="submit">설정 저장</button>
    </form>

    <div class="card">
      <h2>등록된 종목</h2>
      <div id="holding-admin"></div>
    </div>
  </section>

  <script src="/static/app.js"></script>
</body>
</html>
